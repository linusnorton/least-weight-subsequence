name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  diagram:
    name: Diagram is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generator strips types natively, which needs Node 22.6 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Regenerating cross-checks the trace against the real implementation, so a
      # behaviour change fails here rather than shipping a misleading diagram.
      - run: npm run diagram

      - name: Fail if docs/algorithm.svg is stale
        run: git diff --exit-code -- docs/
